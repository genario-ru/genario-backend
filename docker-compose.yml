# ${DEPLOY_ENVIRONMENT}, ${IMAGE_TAG}, and the secrets below are injected by
# Dokploy from the application Environment when `docker compose up` runs.
# They are not build args and not GitHub Actions values.
# Each environment (stage / production) sets its own values on its own Dokploy app.
# DEPLOY_ENVIRONMENT and IMAGE_TAG use ${VAR:?...}, so a missing value fails
# the compose file instead of pulling another environment's image by default.
services:
  # One-shot service: applies migrations once and exits.
  # server and workers wait for that success via depends_on, so the schema
  # is current before the application starts.
  migrate:
    image: ghcr.io/genario-ru/genario-backend-${DEPLOY_ENVIRONMENT:?DEPLOY_ENVIRONMENT is required (set it in the Dokploy app environment)}:${IMAGE_TAG:?IMAGE_TAG is required (set it in the Dokploy app environment)}
    pull_policy: always
    command: pnpm run db:migrate
    restart: "no"
    networks:
      - dokploy-network
    environment:
      - NODE_ENV=${NODE_ENV}
      - POSTGRES_URL=${POSTGRES_URL}

  server:
    image: ghcr.io/genario-ru/genario-backend-${DEPLOY_ENVIRONMENT:?DEPLOY_ENVIRONMENT is required (set it in the Dokploy app environment)}:${IMAGE_TAG:?IMAGE_TAG is required (set it in the Dokploy app environment)}
    pull_policy: always
    command: pnpm run start
    # No host port: production and stage share one server, and Traefik
    # (Dokploy) reaches the container on dokploy-network port 3000.
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - dokploy-network
    # Labels for the shared monitoring agent (ilialksv-monitoring/agent).
    # It finds this container and scrapes /metrics over the internal network.
    labels:
      monitoring.scrape: "true"
      monitoring.port: "3000"
      monitoring.job: backend
      monitoring.project: genario
      monitoring.env: ${DEPLOY_ENVIRONMENT}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=${NODE_ENV}
      - POSTGRES_URL=${POSTGRES_URL}
      - REDIS_URL=${REDIS_URL}
      - S3_BUCKET_BASE_URL=${S3_BUCKET_BASE_URL}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - BETTER_AUTH_FIXED_SIGN_IN_OTPS=${BETTER_AUTH_FIXED_SIGN_IN_OTPS}
      - DISABLE_SIGN_UP=${DISABLE_SIGN_UP}
      - POLZA_AI_BASE_URL=${POLZA_AI_BASE_URL}
      - POLZA_AI_API_KEY=${POLZA_AI_API_KEY}
      - POLZA_AI_STRUCTURED_OUTPUT_MODEL=${POLZA_AI_STRUCTURED_OUTPUT_MODEL}
      - POLZA_AI_IMAGE_MODEL=${POLZA_AI_IMAGE_MODEL}
      - VSELLM_BASE_URL=${VSELLM_BASE_URL}
      - VSELLM_API_KEY=${VSELLM_API_KEY}
      - VSELLM_STRUCTURED_OUTPUT_MODEL=${VSELLM_STRUCTURED_OUTPUT_MODEL}
      - VSELLM_IMAGE_MODEL=${VSELLM_IMAGE_MODEL}
      - SOCIALKIT_OPENAPI_URL=${SOCIALKIT_OPENAPI_URL}
      - SOCIALKIT_BASE_API_URL=${SOCIALKIT_BASE_API_URL}
      - SOCIALKIT_API_KEY=${SOCIALKIT_API_KEY}
      - YOOKASSA_OPENAPI_URL=${YOOKASSA_OPENAPI_URL}
      - YOOKASSA_BASE_URL=${YOOKASSA_BASE_URL}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOOKASSA_IPS=${YOOKASSA_IPS}
      - DISABLE_PAYMENTS=${DISABLE_PAYMENTS}
      - SUBSCRIPTIONS_CHARGE_SCHEDULER_ENABLED=${SUBSCRIPTIONS_CHARGE_SCHEDULER_ENABLED}
      - UPCOMING_CHARGES_NEWSLETTER_SCHEDULER_ENABLED=${UPCOMING_CHARGES_NEWSLETTER_SCHEDULER_ENABLED}
      - TERMINATE_EXPIRED_CREDITS_BATCHES_SCHEDULER_ENABLED=${TERMINATE_EXPIRED_CREDITS_BATCHES_SCHEDULER_ENABLED}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
      - BACKEND_BASE_URL=${BACKEND_BASE_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - METRICS_ALLOWED_IPS=${METRICS_ALLOWED_IPS}
      - LOCAL_DEVELOPMENT_IPS=${LOCAL_DEVELOPMENT_IPS}
      - TRUSTED_PROXY_COUNT=${TRUSTED_PROXY_COUNT}
      - GLITCHTIP_DSN=${GLITCHTIP_DSN}

  workers:
    image: ghcr.io/genario-ru/genario-backend-${DEPLOY_ENVIRONMENT:?DEPLOY_ENVIRONMENT is required (set it in the Dokploy app environment)}:${IMAGE_TAG:?IMAGE_TAG is required (set it in the Dokploy app environment)}
    pull_policy: always
    command: pnpm run start:workers
    restart: unless-stopped
    networks:
      - dokploy-network
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=${NODE_ENV}
      - POSTGRES_URL=${POSTGRES_URL}
      - REDIS_URL=${REDIS_URL}
      - S3_BUCKET_BASE_URL=${S3_BUCKET_BASE_URL}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - BETTER_AUTH_FIXED_SIGN_IN_OTPS=${BETTER_AUTH_FIXED_SIGN_IN_OTPS}
      - DISABLE_SIGN_UP=${DISABLE_SIGN_UP}
      - POLZA_AI_BASE_URL=${POLZA_AI_BASE_URL}
      - POLZA_AI_API_KEY=${POLZA_AI_API_KEY}
      - POLZA_AI_STRUCTURED_OUTPUT_MODEL=${POLZA_AI_STRUCTURED_OUTPUT_MODEL}
      - POLZA_AI_IMAGE_MODEL=${POLZA_AI_IMAGE_MODEL}
      - VSELLM_BASE_URL=${VSELLM_BASE_URL}
      - VSELLM_API_KEY=${VSELLM_API_KEY}
      - VSELLM_STRUCTURED_OUTPUT_MODEL=${VSELLM_STRUCTURED_OUTPUT_MODEL}
      - VSELLM_IMAGE_MODEL=${VSELLM_IMAGE_MODEL}
      - SOCIALKIT_OPENAPI_URL=${SOCIALKIT_OPENAPI_URL}
      - SOCIALKIT_BASE_API_URL=${SOCIALKIT_BASE_API_URL}
      - SOCIALKIT_API_KEY=${SOCIALKIT_API_KEY}
      - YOOKASSA_OPENAPI_URL=${YOOKASSA_OPENAPI_URL}
      - YOOKASSA_BASE_URL=${YOOKASSA_BASE_URL}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - SUBSCRIPTIONS_CHARGE_SCHEDULER_ENABLED=${SUBSCRIPTIONS_CHARGE_SCHEDULER_ENABLED}
      - UPCOMING_CHARGES_NEWSLETTER_SCHEDULER_ENABLED=${UPCOMING_CHARGES_NEWSLETTER_SCHEDULER_ENABLED}
      - TERMINATE_EXPIRED_CREDITS_BATCHES_SCHEDULER_ENABLED=${TERMINATE_EXPIRED_CREDITS_BATCHES_SCHEDULER_ENABLED}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
      - BACKEND_BASE_URL=${BACKEND_BASE_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - GLITCHTIP_DSN=${GLITCHTIP_DSN}

  # Database exporters for this environment. They publish nothing;
  # the monitoring agent scrapes them.
  # POSTGRES_EXPORTER_DATA_SOURCE_NAME is separate from POSTGRES_URL:
  # a Dokploy URL often already has a query string, and appending ?sslmode=disable breaks it.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=${POSTGRES_EXPORTER_DATA_SOURCE_NAME:?POSTGRES_EXPORTER_DATA_SOURCE_NAME is required (set it in the Dokploy app environment)}
    networks:
      - dokploy-network
    labels:
      monitoring.scrape: "true"
      monitoring.port: "9187"
      monitoring.job: postgres
      monitoring.project: genario
      monitoring.env: ${DEPLOY_ENVIRONMENT}

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    environment:
      - REDIS_ADDR=${REDIS_URL}
    networks:
      - dokploy-network
    labels:
      monitoring.scrape: "true"
      monitoring.port: "9121"
      monitoring.job: redis
      monitoring.project: genario
      monitoring.env: ${DEPLOY_ENVIRONMENT}

networks:
  # Shared Dokploy network: Traefik, Dokploy databases, and the monitoring agent.
  dokploy-network:
    external: true
